# Render Blueprint (https://render.com/docs/blueprint-spec) for the FastAPI
# serving layer (src/model/api.py) - deploys docker/Dockerfile.api as a
# standalone web service, reachable from anywhere, so the Next.js
# frontend's AI Decision Assistant tab (and every other dashboard-facing
# endpoint it calls) has a backend to reach.
#
# Not auto-deployed by anything in this repo - a human connects this repo
# on render.com (New -> Blueprint) and Render reads this file from there.
# Free tier: the service spins down after ~15 minutes idle and the next
# request pays a cold-start delay (10-50s) to spin back up - expected
# behavior on the free plan, not a bug.
#
# Env vars marked `sync: false` are secrets/host-specific values Render
# will prompt for at Blueprint creation time rather than auto-generating -
# point these at the same Neon project the frontend/warehouse use (see
# README step 6), so both this API and any local/dev usage read the same
# warehouse.
#
# Horizontal scaling (`numInstances` below, commented out): verified
# api.py is safe to run as multiple replicas before enabling this - it
# writes nothing to local disk at request time (grepped for it: no
# .write_text/.to_csv/.dump outside models_store, which is read-only at
# runtime), and everything that IS persisted (ai_traces, the LLM
# explanation cache, drift results) already goes to the shared Postgres
# database, not local state. `numInstances` > 1 requires a paid plan -
# Render's free tier is capped at one instance with no autoscaling.
# TLS: automatic on Render for every plan (including free), terminated
# at their edge - no separate certificate/reverse-proxy config needed
# for this deployment path specifically (see docker-compose.yml's new
# `caddy` service for the self-hosted-outside-Render case, which has no
# such platform-provided TLS).

services:
  - type: web
    name: telecom-churn-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    plan: free
    # numInstances: 3   # uncomment on a paid plan for real horizontal
                         # scaling behind Render's built-in load balancer
    healthCheckPath: /health
    envVars:
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      # Optional - see README's "AI Agent Layer" section for the fallback
      # behavior when unset (/explain-churn narrates raw SHAP instead).
      - key: GROQ_API_KEY
        sync: false
      # Deliberately not set here: this deployment has no mlflow service
      # alongside it, and src/model/registry.py's fallback to
      # glob-latest-by-timestamp (baked into the Docker image's
      # models_store/) already handles that correctly - see
      # src/model/registry.py's own docstring.
      #
      # The frontend service's public URL below, once known (see that
      # service's own comment) - a browser fetch from a different origin
      # needs this or every request from telecom-churn-frontend gets
      # rejected. sync: false since it's genuinely unknown until the
      # frontend service exists.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Eager startup warming (src/model/api.py's _warm_all) is fine on a
      # 3GB local Docker container but caused a real, confirmed OOM crash
      # loop on Render's free-tier memory ceiling - the RAG embedder +
      # reranker alone are ~300-500MB of PyTorch/transformers, loaded
      # within seconds of boot. The process never finished starting; it
      # was silently SIGKILLed a few minutes into every attempt and
      # restarted into the same trap. Turned off here specifically -
      # local/Docker keeps the eager warm (docker-compose.yml sets
      # nothing, so the code's own default of "true" applies there).
      # Trades the original problem (a slow first RAG/at-risk request)
      # for a service that reliably stays up, which is the only
      # acceptable trade on a memory tier this tight.
      - key: WARM_MODELS_ON_STARTUP
        value: "false"

  - type: web
    name: telecom-churn-frontend
    # The Next.js frontend (frontend/) - see README's "Deploying the API
    # and the Next.js frontend to Render" section for why this and the
    # API above exist as their own Render services.
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.frontend
    dockerContext: .
    plan: free
    envVars:
      # Render passes a Docker-runtime service's envVars as build args
      # too, not just at runtime - which is what this actually needs,
      # since NEXT_PUBLIC_API_URL is inlined into the browser bundle at
      # BUILD time (see docker/Dockerfile.frontend's comment). Bootstrap
      # order: create this service once first (any placeholder value),
      # note the api service's real public URL once it exists, set this
      # to that URL, then trigger a manual redeploy of *this* service
      # specifically - a plain env var update alone won't re-inline a
      # build-time value into the already-built bundle.
      - key: NEXT_PUBLIC_API_URL
        sync: false
