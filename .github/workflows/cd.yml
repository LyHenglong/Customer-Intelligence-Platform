name: CD

# Runs after the "CI" workflow finishes successfully on main - not a
# duplicate test job, so there's one source of truth for "how the test
# suite runs" (ci.yml). Publishing a broken/untested image is worse than
# not publishing one at all.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  # ghcr.io repo path is case-sensitive and must be lowercase - github.repository
  # preserves the owner/repo's real casing, so it's lowercased below rather than
  # relied on directly.

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to push to GitHub Container Registry under this repo -
      # no separate registry account/secret required, unlike Docker Hub.
      packages: write
    strategy:
      matrix:
        # mlflow isn't included: it's a lightly-used internal registry
        # service (see docker-compose.yml's comment), never deployed
        # standalone/scaled the way api/dashboard are - built locally by
        # anyone running the stack, same as postgres's off-the-shelf image.
        image: [api, dashboard]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          push: true
          # Both a rolling `latest` and the immutable commit SHA - the SHA
          # tag is what makes a specific deploy reproducible/rollback-able;
          # `latest` is convenience for anyone just pulling the newest.
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
