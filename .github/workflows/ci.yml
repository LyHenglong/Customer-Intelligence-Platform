name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.13.3
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run unit tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Coverage summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"### Unit-test line coverage: {rate:.1f}%")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  integration:
    name: Integration (Postgres + dbt)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as docker-compose.yml: db/schema.sql needs pgvector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d warehouse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: warehouse
      POSTGRES_SSLMODE: disable
      PGPASSWORD: ci
      AI_SQL_READER_PASSWORD: reader-pw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      - name: Create warehouse schema
        run: psql -h localhost -U ci -d warehouse -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Ingest the fixture batch
        run: |
          python -c "from pathlib import Path; from src.ingest.batch_loader import load_batch; load_batch(Path('tests/fixtures/sample_batch.csv'))"

      - name: dbt build (models + data tests)
        working-directory: dbt
        run: dbt build --profiles-dir .

      - name: Create the AI SQL tool's least-privilege role
        run: psql -h localhost -U ci -d warehouse -v ON_ERROR_STOP=1 -v ai_sql_password="'reader-pw'" -f db/ai_readonly_role.sql

      - name: Integration tests
        run: RUN_INTEGRATION=1 pytest tests/integration -v

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke tests (Playwright, mocked API)
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
