x-airflow-common: &airflow-common
  # Explicit shared image name: without this, compose tags each service's
  # build separately (customerintelligence-airflow-init,
  # -airflow-webserver, -airflow-scheduler) even though they share this
  # exact same Dockerfile/context - rebuilding one then leaves the other
  # two silently on stale images. One shared tag means one build covers
  # all three.
  image: customerintelligence-airflow:latest
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    # App-level env vars our DAG tasks / scripts read (same names dbt and
    # local scripts use, so behavior is identical in and out of Docker)
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    DBT_PROFILES_DIR: /opt/airflow/dbt
    RETRAIN_EVERY_N_BATCHES: ${RETRAIN_EVERY_N_BATCHES}
    # AI Agent Layer (src/agents/): read by the summarize_retrain task.
    # Optional - see the README's "AI Agent Layer" section for the
    # fallback behavior when this is unset or Groq is unreachable.
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    # so `from src.ingest.batch_loader import ...` resolves inside DAG
    # task code - /opt/airflow isn't on sys.path by default.
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
    - ./db:/opt/airflow/db
    - ./models_store:/opt/airflow/models_store
    - ./logs:/opt/airflow/logs
    # summarize_retrain writes report/retrain_summaries/*.md here -
    # mounted (not baked into the image) so those files land on the host
    # alongside report/findings.md, visible outside the container.
    - ./report:/opt/airflow/report
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    # pgvector/pgvector:pg16, not postgres:16-alpine: same Postgres 16,
    # plus the pgvector extension public.rag_chunks needs (src/ai/rag/) -
    # one image swap rather than a second database service, per
    # AI_Customer_Intelligence_Claude_Code_Plan.md section 4's instruction
    # to avoid unnecessary infrastructure. Neon (the hosted deployment
    # target) supports the same "CREATE EXTENSION vector" directly.
    image: pgvector/pgvector:pg16
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW_DB: ${AIRFLOW_DB}
    ports:
      # Host port 5433, not 5432: this machine already runs a native
      # Windows PostgreSQL service on 5432, which silently intercepts
      # 127.0.0.1:5432 connections meant for this container (dual-stack
      # binding conflict). Internal container-to-container traffic
      # (Airflow, dashboard) still uses port 5432 on the "postgres" service
      # name and is unaffected by this remap.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
      - ./db/schema.sql:/docker-entrypoint-initdb.d/zz-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname "${AIRFLOW_ADMIN_FIRSTNAME}" \
          --lastname "${AIRFLOW_ADMIN_LASTNAME}" \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      # Host port 8081, not 8080: another unrelated project
      # ("careerintelligence") already has an Airflow webserver bound to
      # 8080 on this machine. Internal container port stays 8080.
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 1200m

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    # The scheduler is where model retraining actually executes (the DAG's
    # retrain task runs in-process under LocalExecutor), so it needs more
    # headroom than a scheduler normally would. At 900m the retrain task was
    # OOM-killed (SIGKILL / return code -9) once customer_360 passed ~460K
    # rows. Raised alongside the chunked-read and MAX_TRAINING_ROWS fixes in
    # train_churn.py - the code fixes do the real work; this is margin.
    mem_limit: 1600m

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      # /recommend falls back to a warehouse lookup when a customer isn't in
      # the recommender's bounded reference set - the common case at 1M
      # customers. Predictions and index hits still need no DB at all.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # AI Agent Layer: read by /explain-churn. Optional - see the
      # README's "AI Agent Layer" section for the fallback behavior.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - ./models_store:/app/models_store
    profiles: ["serving"]
    mem_limit: 400m

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # AI Agent Layer: read by the At-Risk Customers view's explanation
      # and outreach sections. Optional - see the README's "AI Agent
      # Layer" section for the fallback behavior when unset.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # AI Decision Assistant tab (src/ai/graph.py): the dashboard calls
      # the api service over HTTP rather than importing src.ai directly,
      # since that needs sentence-transformers/PyTorch - see
      # call_assistant_api()'s docstring in src/dashboard/app.py. Unset
      # (empty) on Streamlit Cloud, where there is no api service.
      AI_API_URL: http://api:8000
      # `streamlit run <script>` only adds the script's own directory to
      # sys.path, not the working directory - unlike a plain `python -c`
      # shell, which is why this didn't surface under `docker exec`
      # testing. `from src.model.train_churn import ...` needs /app on
      # the path explicitly.
      PYTHONPATH: /app
    volumes:
      - ./models_store:/app/models_store
    ports:
      - "8501:8501"
    depends_on:
      - postgres
      - api
    profiles: ["serving"]
    # Scoring 1,000,000 customers needs real headroom even after the
    # streaming redesign (see score_all_customers). On this 3.8GB Docker VM
    # that means not running orchestration and serving flat out at the same
    # time - stop airflow-* while using the dashboard, or vice versa.
    # 400m (later 768m) was OOM-killed (exit 137) under a real browser
    # session - Streamlit's full session/WebSocket state plus rendering 3
    # plotly charts uses meaningfully more memory than a headless one-shot
    # script run. app.py was also fixed to stop wastefully full-copying the
    # 300K+ row dataframe and to stop pulling the unused signup_date column;
    # this limit is a safety margin on top of those fixes, not a
    # replacement for them - the host itself is memory-constrained (see
    # README's RAM rationale), so it isn't raised further than this.
    mem_limit: 2048m

volumes:
  pgdata:
