x-airflow-common: &airflow-common
  # Explicit shared image name: without this, compose tags each service's
  # build separately (customerintelligence-airflow-init,
  # -airflow-webserver, -airflow-scheduler) even though they share this
  # exact same Dockerfile/context - rebuilding one then leaves the other
  # two silently on stale images. One shared tag means one build covers
  # all three.
  image: customerintelligence-airflow:latest
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    # App-level env vars our DAG tasks / scripts read (same names dbt and
    # local scripts use, so behavior is identical in and out of Docker)
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    DBT_PROFILES_DIR: /opt/airflow/dbt
    RETRAIN_EVERY_N_BATCHES: ${RETRAIN_EVERY_N_BATCHES}
    # Model registry/tracking (src/model/registry.py, train_churn.py,
    # train_recommender.py) - best-effort: if mlflow isn't reachable when
    # a retrain task runs, training still succeeds exactly as before, just
    # without registry bookkeeping for that run (see registry.py's
    # fallback-to-glob-latest behavior).
    MLFLOW_TRACKING_URI: http://mlflow:5000
    # AI Agent Layer (src/agents/): read by the summarize_retrain task.
    # Optional - see the README's "AI Agent Layer" section for the
    # fallback behavior when this is unset or Groq is unreachable.
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    # Drift/task-failure alerting (src/monitoring/alerting.py). Optional -
    # unset means send_slack_alert() is a no-op, same fallback convention
    # as GROQ_API_KEY above.
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    # so `from src.ingest.batch_loader import ...` resolves inside DAG
    # task code - /opt/airflow isn't on sys.path by default.
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
    - ./db:/opt/airflow/db
    - ./models_store:/opt/airflow/models_store
    - ./logs:/opt/airflow/logs
    # summarize_retrain writes report/retrain_summaries/*.md here -
    # mounted (not baked into the image) so those files land on the host
    # alongside report/findings.md, visible outside the container.
    - ./report:/opt/airflow/report
    # dags/backup_warehouse.py's pg_dump output - mounted (not baked into
    # the image) so backups survive a container rebuild/recreate.
    - ./backups:/opt/airflow/backups
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    # pgvector/pgvector:pg16, not postgres:16-alpine: same Postgres 16,
    # plus the pgvector extension public.rag_chunks needs (src/ai/rag/) -
    # one image swap rather than a second database service, per
    # AI_Customer_Intelligence_Claude_Code_Plan.md section 4's instruction
    # to avoid unnecessary infrastructure. Neon (the hosted deployment
    # target) supports the same "CREATE EXTENSION vector" directly.
    image: pgvector/pgvector:pg16
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW_DB: ${AIRFLOW_DB}
      MLFLOW_DB: ${MLFLOW_DB}
    ports:
      # Host port 5433, not 5432: this machine already runs a native
      # Windows PostgreSQL service on 5432, which silently intercepts
      # 127.0.0.1:5432 connections meant for this container (dual-stack
      # binding conflict). Internal container-to-container traffic
      # (Airflow, dashboard) still uses port 5432 on the "postgres" service
      # name and is unaffected by this remap.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
      - ./db/schema.sql:/docker-entrypoint-initdb.d/zz-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  mlflow:
    # Model registry/tracking server - closes the "no registry, newest-
    # file-wins" gap (see src/model/registry.py). Backend store is a
    # dedicated database on this SAME Postgres instance (created by
    # docker/init-multi-db.sh, mirroring the AIRFLOW_DB precedent above),
    # not SQLite - production-compatible and consistent with how the rest
    # of this stack already treats Postgres as the one stateful service.
    # Artifact store is a local bind mount, same convention as
    # ./models_store - this is bookkeeping/provenance, not the file the
    # api/dashboard actually load at runtime (that's still
    # models_store/*.joblib, resolved by src/model/registry.py).
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    # --backend-store-uri/--default-artifact-root are CLI-only flags for
    # `mlflow server` (it does not read MLFLOW_BACKEND_STORE_URI from its
    # own environment the way mlflow's *client* reads MLFLOW_TRACKING_URI),
    # so the composed URL is interpolated directly into command: here -
    # compose resolves ${...} in command: from top-level/.env vars
    # (POSTGRES_USER/POSTGRES_PASSWORD/MLFLOW_DB, all defined in .env),
    # the same interpolation AIRFLOW__DATABASE__SQL_ALCHEMY_CONN above
    # already relies on. No raw DATABASE_URL stored in .env.
    # --workers 2, not gunicorn's default of 4: this is a lightly-used
    # internal registry service (a handful of requests per training run
    # or process startup, never real traffic), and 4 workers under the
    # mem_limit below was OOM-killed (exit 137) in practice.
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${MLFLOW_DB}
      --default-artifact-root /mlflow/artifacts
      --workers 2
      --host 0.0.0.0 --port 5000
    ports:
      # Host port 5001, not 5000: 5000 is commonly taken by other local
      # services (e.g. macOS AirPlay). Internal container-to-container
      # traffic (airflow, api, dashboard) still uses port 5000 on the
      # "mlflow" service name.
      - "5001:5000"
    volumes:
      - ./mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    # Raised from 300m after an observed OOM-kill (exit 137) under the
    # default 4-worker gunicorn config - see the --workers 2 comment above,
    # which addresses the actual cause; this is margin on top of that fix,
    # not a replacement for it (same reasoning as postgres's mem_limit).
    mem_limit: 512m

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname "${AIRFLOW_ADMIN_FIRSTNAME}" \
          --lastname "${AIRFLOW_ADMIN_LASTNAME}" \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      # Host port 8081, not 8080: another unrelated project
      # ("careerintelligence") already has an Airflow webserver bound to
      # 8080 on this machine. Internal container port stays 8080.
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 1200m

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    # The scheduler is where model retraining actually executes (the DAG's
    # retrain task runs in-process under LocalExecutor), so it needs more
    # headroom than a scheduler normally would. At 900m the retrain task was
    # OOM-killed (SIGKILL / return code -9) once customer_360 passed ~460K
    # rows. Raised alongside the chunked-read and MAX_TRAINING_ROWS fixes in
    # train_churn.py - the code fixes do the real work; this is margin.
    mem_limit: 1600m
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$HOSTNAME\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      # /recommend falls back to a warehouse lookup when a customer isn't in
      # the recommender's bounded reference set - the common case at 1M
      # customers. Predictions and index hits still need no DB at all.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # AI Agent Layer: read by /explain-churn. Optional - see the
      # README's "AI Agent Layer" section for the fallback behavior.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Model registry (src/model/registry.py) - best-effort, same
      # fallback-to-glob-latest behavior as everywhere else this is set.
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # The frontend service's browser-facing origin(s), comma-separated -
      # a browser fetch from a different port is a different origin, so
      # this is required for the frontend to reach this API at all, not
      # just a hardening nicety. Unset -> CORSMiddleware allows nothing,
      # a safe default for a still-unauthenticated API - see
      # src/model/api.py's own comment on why this is read at import
      # time (restart needed on change).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      - postgres
      - mlflow
    ports:
      - "8000:8000"
    volumes:
      - ./models_store:/app/models_store
    profiles: ["serving"]
    # Raised from 400m after a real, reproduced OOM-kill (exit 137,
    # OOMKilled=true) on the very first /assistant/query request - 400m
    # covers the churn/recommender artifacts fine, but the RAG path
    # (src/ai/rag/embeddings.py, .../reranker.py) additionally loads
    # sentence-transformers + a torch runtime + a cross-encoder reranker
    # model into the same process on first use, which 400m never
    # actually had room for. 1536m was tried next and technically
    # survived, but peaked at 99.76% of that limit (measured via `docker
    # stats` mid-request) - too close to the edge for reliable repeat
    # use. Raised again from 2048m after /overview/stats and /at-risk
    # (dashboard_queries.score_all_customers, a full ~1M-row streaming
    # pass - see src/model/api.py's _get_scored_customers) reproduced the
    # same problem a second way: peaked at 99.96% of 2048m, and - unlike
    # the RAG path - stayed pinned near 98% even after the request
    # finished (CPython/pandas not returning freed batch memory to the
    # OS after the streaming pass, not a leak - see
    # score_all_customers's own docstring on why batch size, not the
    # retained ~40MB result, sets the transient peak). 3072m leaves real
    # margin above that observed *settled*, not just peak, usage.
    mem_limit: 3072m

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # AI Agent Layer: read by the At-Risk Customers view's explanation
      # and outreach sections. Optional - see the README's "AI Agent
      # Layer" section for the fallback behavior when unset.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # AI Decision Assistant tab (src/ai/graph.py): the dashboard calls
      # the api service over HTTP rather than importing src.ai directly,
      # since that needs sentence-transformers/PyTorch - see
      # call_assistant_api()'s docstring in src/dashboard/app.py. Unset
      # (empty) on Streamlit Cloud, where there is no api service.
      AI_API_URL: http://api:8000
      # `streamlit run <script>` only adds the script's own directory to
      # sys.path, not the working directory - unlike a plain `python -c`
      # shell, which is why this didn't surface under `docker exec`
      # testing. `from src.model.train_churn import ...` needs /app on
      # the path explicitly.
      PYTHONPATH: /app
      # Model registry (src/model/registry.py) - best-effort, same
      # fallback-to-glob-latest behavior as everywhere else this is set.
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./models_store:/app/models_store
    ports:
      - "8501:8501"
    depends_on:
      - postgres
      - api
      - mlflow
    profiles: ["serving"]
    # Scoring 1,000,000 customers needs real headroom even after the
    # streaming redesign (see score_all_customers). On this 3.8GB Docker VM
    # that means not running orchestration and serving flat out at the same
    # time - stop airflow-* while using the dashboard, or vice versa.
    # 400m (later 768m) was OOM-killed (exit 137) under a real browser
    # session - Streamlit's full session/WebSocket state plus rendering 3
    # plotly charts uses meaningfully more memory than a headless one-shot
    # script run. app.py was also fixed to stop wastefully full-copying the
    # 300K+ row dataframe and to stop pulling the unused signup_date column;
    # this limit is a safety margin on top of those fixes, not a
    # replacement for them - the host itself is memory-constrained (see
    # README's RAM rationale), so it isn't raised further than this.
    mem_limit: 2048m

  frontend:
    # The Next.js frontend (frontend/) - the primary production UI going
    # forward, talking to the api service's dashboard-facing REST
    # endpoints instead of Postgres/the filesystem directly (see
    # src/model/dashboard_queries.py + api.py's new endpoints). The
    # Streamlit dashboard above stays as-is, unaffected - additive, not a
    # replacement.
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        # Consumed by the BROWSER at build time, not this container at
        # runtime - unlike AI_API_URL above (server-to-server, resolves
        # "api" via the compose network fine), this must be a URL the
        # end user's own browser can actually reach. "http://api:8000"
        # here would silently resolve to nothing outside the compose
        # network and break every page - see docker/Dockerfile.frontend
        # and lib/api-client.ts's comments.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    profiles: ["serving"]
    mem_limit: 512m

  caddy:
    # TLS termination + reverse proxy for self-hosting this stack outside
    # Render (which already provides TLS for free on its own - see
    # render.yaml). Only relevant with a real domain's DNS pointed at this
    # host; not useful for local dev (see docker/Caddyfile). A separate
    # "production" profile, not "serving": local/dev use of api+dashboard
    # never needs this, only a real self-hosted deployment does.
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:-}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - dashboard
      - frontend
    profiles: ["production"]
    mem_limit: 128m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
